<!DOCTYPE html>
<!-- v3 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Gestores — ECGNow</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ─── AUTH OVERLAY ─── -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">ECGNow</div>
    <div class="auth-title">Painel de Gestores</div>
    <div class="auth-sub">Acesso restrito à liderança</div>
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="auth-field">
        <label class="auth-label">Senha de acesso</label>
        <input type="password" id="authInput" class="auth-input" placeholder="Digite a senha" autocomplete="current-password">
      </div>
      <div id="authError" class="auth-error" style="display:none">Senha incorreta. Tente novamente.</div>
      <button type="submit" class="auth-btn">Entrar</button>
    </form>
  </div>
</div>

<!-- ─── APP ─── -->
<div id="appContent" style="display:none">

  <header class="header">
    <div class="header-left">
      <span class="logo">ECGNow</span>
      <div class="header-divider"></div>
      <span class="header-title">Painel de Gestores</span>
    </div>
    <div class="header-right">
      <div class="view-toggle">
        <button class="view-btn active" id="viewMonth" onclick="setViewMode('month')">Mensal</button>
        <button class="view-btn" id="viewWeek" onclick="setViewMode('week')">Últimos 7 dias</button>
      </div>
      <div class="period-wrap">
        <span class="period-label">Período</span>
        <select id="selMonth"></select>
        <span class="period-sep">/</span>
        <select id="selYear"></select>
      </div>
      <span class="last-upd" id="lastUpd">—</span>
      <button class="hdr-btn" onclick="refreshAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Atualizar
      </button>
      <button class="hdr-btn hdr-btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" id="tab-GERAL"     onclick="switchTab('GERAL')"><span class="tab-icon">🏠</span> Visão Geral</button>
    <button class="tab-btn"        id="tab-PRODUCAO"  onclick="switchTab('PRODUCAO')"><span class="tab-icon">📊</span> Produção</button>
    <button class="tab-btn"        id="tab-REPETICAO" onclick="switchTab('REPETICAO')"><span class="tab-icon">🔁</span> Repetição</button>
    <button class="tab-btn"        id="tab-FINANCEIRO"onclick="switchTab('FINANCEIRO')"><span class="tab-icon">💰</span> Financeiro</button>
    <button class="tab-btn"        id="tab-NCTS"      onclick="switchTab('NCTS')"><span class="tab-icon">🎯</span> NCTs</button>
    <button class="tab-btn"        id="tab-GERENCIAL" onclick="switchTab('GERENCIAL')"><span class="tab-icon">📋</span> Gerencial</button>
  </nav>

  <main class="main" id="mainContent">
    <div class="loading"><div class="spinner"></div><span class="loading-text">Carregando dados…</span></div>
  </main>

</div>

<script src="js/config.js"></script>
<script src="js/fetch.js"></script>
<script src="js/utils.js"></script>
<script src="js/charts.js"></script>
<script src="js/scorecard.js"></script>
<script src="js/auth.js"></script>
<script src="js/renders/geral.js"></script>
<script src="js/renders/producao.js"></script>
<script src="js/renders/repeticao.js"></script>
<script src="js/renders/financeiro.js"></script>
<script src="js/renders/ncts.js"></script>
<script src="js/renders/gerencial.js"></script>
<script src="js/app.js"></script>
</body>
</html>
